<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行記憶王｜全班連線</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#18314b;background:#edf6ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:8px 0;color:#155a85}h2{margin:8px 0 16px}.card{background:white;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 7px 28px #1c5a8420}.muted{color:#627b8c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:12px}.item{border:2px solid #d7e9f5;border-radius:14px;padding:15px;text-align:center;background:#f8fcff}.emoji{font-size:48px;display:block;margin-bottom:6px}.btn{border:0;background:#087bb6;color:white;border-radius:12px;padding:14px 20px;font-size:17px;font-weight:700;cursor:pointer;margin:5px 4px 5px 0}.btn:disabled{background:#9eafbb;cursor:default}.secondary{background:#e5f2fb;color:#165b85}.danger{background:#b33b50}.choice{display:block;width:100%;background:#f2f8fc;color:#153e59;border:2px solid #b9d7e9;text-align:left}.choice.selected{border-color:#087bb6;background:#d3efff}.choice.correct{background:#d9f8e5;border-color:#20a25b}.choice.wrong{background:#ffe4e4;border-color:#df6666}input,select{font:inherit;padding:12px;border:1px solid #b4ccdd;border-radius:10px;width:100%;margin:5px 0 12px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.code{font-size:45px;letter-spacing:7px;font-weight:800;color:#087bb6}.pill{display:inline-block;background:#e2f2ff;padding:6px 12px;border-radius:99px;margin:4px}.bar{background:#e3eef5;border-radius:10px;overflow:hidden;height:14px}.fill{height:100%;background:#168bc2}.leader{display:flex;justify-content:space-between;border-bottom:1px solid #e6eef3;padding:10px}.big{font-size:26px;font-weight:800}.notice{padding:12px;background:#fff3d9;border-radius:10px;margin:12px 0}#toast{position:fixed;bottom:12px;left:12px;right:12px;max-width:500px;margin:auto;background:#243e56;color:white;padding:13px;border-radius:12px;display:none}img.qr{width:180px;max-width:100%}button:focus-visible,input:focus-visible{outline:3px solid #e9a02e} @media(max-width:520px){.wrap{padding:12px}.card{padding:17px}.code{font-size:36px}}
</style></head><body><div class="wrap"><header><h1>🌍 旅行記憶王</h1><span class="pill" id="status">連線中</span></header><div id="app"></div></div><div id="toast" role="alert"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),app=document.querySelector('#app');let state=null,role='',token='',playerId='',myAnswer=null,hostCode='',lastRound=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const qs=new URLSearchParams(location.search);const saved=JSON.parse(sessionStorage.getItem('travelSession')||'null');function toast(s){let x=document.querySelector('#toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',4000)}function send(event,data,cb){socket.emit(event,data,r=>{if(!r?.ok)toast(r?.error||'操作失敗');else cb?.(r)})}function save(o){sessionStorage.setItem('travelSession',JSON.stringify(o))}function button(label,action,cls=''){return `<button class="btn ${cls}" data-act="${action}">${label}</button>`}function setup(){role='';app.innerHTML=`<section class="card"><h2>歡迎加入旅行記憶王！</h2><p>老師主持出題，學生同步記憶、猜題，挑戰個人及小組排行榜。</p><div class="grid"><div><h3>👩‍🏫 我是老師</h3>${button('建立遊戲房間','createForm')}</div><div><h3>🧑‍🎓 我是學生</h3>${button('加入遊戲','joinForm','secondary')}</div></div></section>`;if(qs.get('room'))joinForm(qs.get('room'))}function createForm(){app.innerHTML=`<section class="card"><h2>建立教師房間</h2><div class="formgrid"><label>遊戲回合數<input id="total" type="number" min="1" max="40" value="10"></label><label>答題秒數<input id="seconds" type="number" min="5" max="90" value="20"></label><label>小組數<input id="teams" type="number" min="1" max="10" value="4"></label><label>挑戰模式<select id="mode"><option value="mixed">四種模式輪流</option><option value="memory">物品記憶</option><option value="identify">神祕物品</option><option value="missing">消失物品</option><option value="final">位置記憶</option></select></label></div>${button('建立房間','createNow')}${button('返回','home','secondary')}</section>`}function joinForm(c=''){app.innerHTML=`<section class="card"><h2>學生加入</h2><label>6位數房間代碼<input id="room" inputmode="numeric" maxlength="6" placeholder="例如 123456" value="${esc(c)}"></label><label>座號或姓名<input id="name" maxlength="18" placeholder="例如 05號 小明"></label>${button('加入遊戲','joinNow')}${button('返回','home','secondary')}</section>`}function boardHtml(items,hidden){return `<div class="items">${items.map((x,i)=>`<div class="item"><span class="emoji">${hidden?'❓':esc(x.emoji)}</span><b>${hidden?'?':esc(x.name)}</b><div class="muted">位置 ${i+1}</div></div>`).join('')}</div>`}function leader(s){let people=[...s.players].sort((a,b)=>b.score-a.score);let teams=Array.from({length:s.teams},(_,i)=>({name:`第 ${i+1} 組`,score:s.players.filter(p=>p.team===i+1).reduce((a,p)=>a+p.score,0)})).sort((a,b)=>b.score-a.score);return `<div class="grid"><div><h3>🏆 個人排行榜</h3>${people.map((p,i)=>`<div class="leader"><span>${i+1}. ${esc(p.name)} <small class="muted">第${p.team}組</small></span><b>${p.score}</b></div>`).join('')}</div><div><h3>🤝 小組排行榜</h3>${teams.map((t,i)=>`<div class="leader"><span>${i+1}. ${t.name}</span><b>${t.score}</b></div>`).join('')}</div></div>`}function exportCSV(){if(!state)return;let rows=[['姓名','組別','分數'],...state.players.map(p=>[p.name,p.team,p.score])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`旅行記憶王_${state.code}_成績.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function render(){if(!state)return;let s=state,isHost=role==='host',me=s.players.find(p=>p.id===playerId),html=`<section class="card"><div class="grid"><div><span class="muted">房間代碼</span><div class="code">${s.code}</div></div><div><span class="muted">遊戲進度</span><div class="big">${s.round} / ${s.total} 回合</div><div class="muted">${{lobby:'等待加入',memorize:'記憶時間',question:'作答時間',result:'公布答案',finished:'遊戲結束'}[s.phase]}</div></div></div></section>`;
if(s.phase==='lobby'){html+=`<section class="card"><h2>🎒 準備出發！</h2>${isHost?`<p>請學生掃描 QR Code，或輸入房間代碼。</p><img class="qr" alt="學生加入房間 QR Code" src="/qr/${s.code}"><p class="muted">學生加入網址：${esc(location.origin+'/?room='+s.code)}</p>${button('開始遊戲','start')}`:`<p>已加入第 ${me?.team||'?'} 組。等待老師開始遊戲。</p>`}<h3>已加入 ${s.players.length} 人</h3><div>${s.players.map(p=>`<span class="pill">${esc(p.name)} · ${p.team}組 ${p.connected?'🟢':'⚪'}</span>`).join('')}</div></section>`}
if(s.phase==='memorize'){let missing=s.mode==='missing'||(s.mode==='mixed'&&(s.round-1)%4===2);html+=`<section class="card"><h2>👀 請記住這些旅行物品！</h2><p class="muted">記住物品與順序，老師按下按鈕後開始答題。</p>${boardHtml(s.board,false)}${isHost?button('隱藏物品，開始作答','question'): '<div class="notice">仔細觀察！等待老師開始出題。</div>'}</section>`}
if(s.phase==='question'){let q=s.question;html+=`<section class="card"><h2>❓ ${esc(q.prompt)}</h2>${q.emoji?`<div style="font-size:75px;text-align:center">${esc(q.emoji)}</div>`:''}${q.mode==='missing'?boardHtml(s.board,false):''}<p class="big" id="clock">⏱️ --</p><div class="grid">${q.choices.map((c,i)=>`<button class="btn choice ${myAnswer===i?'selected':''}" data-act="answer" data-index="${i}" ${myAnswer!==null||isHost?'disabled':''}>${'ABCD'[i]}. ${esc(c)}</button>`).join('')}</div>${isHost?`<div class="notice">已作答 ${s.players.filter(p=>p.answered).length} / ${s.players.length} 人</div>${button('提前公布答案','reveal')}`:myAnswer!==null?'<div class="notice">答案已送出，等待公布！</div>':''}</section>`}
if(s.phase==='result'){let a=s.answer;html+=`<section class="card"><h2>🎉 正確答案：${esc(a.correct)}</h2><div class="grid">${s.question?.choices?.map((c,i)=>`<div class="item ${i===a.correctIndex?'correct':''}">${'ABCD'[i]}. ${esc(c)}<div> ${s.stats.counts[i]} 人</div></div>`).join('')||''}</div><p>本回合答對 +100 分，未答對 +0 分。</p>${isHost?button(s.round===s.total?'結束並公布總排名':'下一回合','next'):''}</section>`}
if(s.phase==='finished'){html+=`<section class="card"><h2>🏆 旅行結束！</h2><p>恭喜大家完成旅行記憶挑戰！</p>${isHost?button('匯出成績 CSV','export'):''}${isHost?button('重設再玩一次','reset','secondary'):''}</section>`}
if(s.phase==='result'||s.phase==='finished')html+=`<section class="card">${leader(s)}</section>`;
if(isHost&&s.phase!=='finished')html+=`<section class="card"><details><summary>教師管理與成績</summary>${button('匯出目前成績 CSV','export','secondary')}${button('重設遊戲','reset','danger')}<p class="muted">重設會保留已加入學生，但清除所有分數。</p></details></section>`;
app.innerHTML=html;clock()}
function clock(){let e=document.querySelector('#clock');if(e&&state?.endsAt)e.textContent='⏱️ '+Math.max(0,Math.ceil((state.endsAt-Date.now())/1000))+' 秒'}setInterval(clock,250);
app.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act;if(a==='home')setup();else if(a==='createForm')createForm();else if(a==='joinForm')joinForm();else if(a==='createNow')send('create',{total:+document.querySelector('#total').value,seconds:+document.querySelector('#seconds').value,teams:+document.querySelector('#teams').value,mode:document.querySelector('#mode').value},r=>{role='host';token=r.token;hostCode=r.code;save({role,token,code:r.code});history.replaceState(null,'','/?host='+r.code)});else if(a==='joinNow')send('join',{code:document.querySelector('#room').value.trim(),name:document.querySelector('#name').value.trim()},r=>{role='student';token=r.token;playerId=r.id;hostCode=document.querySelector('#room').value.trim();save({role,token,code:hostCode});history.replaceState(null,'','/?room='+hostCode)});else if(a==='answer'){send('answer',{index:+b.dataset.index},()=>{myAnswer=+b.dataset.index;render()})}else if(a==='export')exportCSV();else if(a==='reset'){if(confirm('確定重設遊戲並清除分數？'))send('hostAction',{action:'reset'})}else if(['start','question','reveal','next'].includes(a))send('hostAction',{action:a})});
socket.on('state',s=>{if(s.code!==hostCode)return;if(s.round!==lastRound){myAnswer=null;lastRound=s.round}state=s;render()});socket.on('errorMessage',toast);socket.on('replaced',()=>toast('主持權限已由其他裝置接手'));socket.on('connect',()=>{document.querySelector('#status').textContent='🟢 已連線';if(saved){hostCode=saved.code;token=saved.token;role=saved.role;if(role==='host')send('hostJoin',{code:hostCode,token},()=>{});else send('join',{code:hostCode,token},r=>{playerId=r.id})}});socket.on('disconnect',()=>document.querySelector('#status').textContent='🔴 重新連線中');setup();
</script></body></html>
